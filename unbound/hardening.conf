# Layered on top of the image's shipped /etc/unbound/unbound.conf via its
# include-toplevel directive. Only settings that differ from this image's
# defaults are listed; everything else (DNSSEC, qname-minimisation, RFC1918
# access-control and private-address, edns-buffer-size) is already correct.

server:
    # Reject attempts to force DNSSEC validation onto a weaker algorithm.
    harden-algo-downgrade: yes

    # Count unsolicited replies -- cache-poisoning attempts -- and flush the
    # cache when the count spikes. Disabled by default (0).
    unwanted-reply-threshold: 10000000

    # Drop oversized queries rather than attempting to answer them.
    harden-large-queries: yes

    # Refuse CHAOS-class version.bind / id.server probes. Low value here since
    # unbound only listens on loopback, but free.
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes
